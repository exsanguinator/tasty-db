[project]
name = "tasty-db"
version = "0.1.0"
description = "Sync TastyTrade transaction history into SQLite for lot-based realized PnL analytics"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "requests>=2.31",
    "click>=8.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.package-data]
tastydb = ["web/templates/*.html", "web/static/*"]

[project.scripts]
tastydb = "tastydb.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tastydb*"]
